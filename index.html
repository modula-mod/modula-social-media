<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media (Fallback)</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b1020;
        color: #e5e7eb;
      }
      .card {
        width: min(680px, calc(100vw - 48px));
        border-radius: 18px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(15, 23, 42, 0.92);
        padding: 20px;
      }
      h1 { margin: 0 0 10px; font-size: 1.25rem; }
      p { margin: 0; line-height: 1.6; color: #cbd5e1; }
      .kicker {
        margin-bottom: 8px;
        display: inline-block;
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .12em;
        background: rgba(56, 189, 248, 0.12);
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="kicker">Fallback only</span>
      <h1>Social Media module fallback shell</h1>
      <p>
        This page is only used when native runtime mounting is unavailable. The real Social feed,
        composer, reactions, and comments are served via backend APIs in native `svelte_component`
        mode and are not hardcoded in this fallback view.
      </p>
    </main>
  </body>
</html>
